map $http_upgrade $kaktusa_conn_upgrade { default upgrade; '' close; }
upstream kaktusa_be { server 127.0.0.1:3200; keepalive 64; }
server {
    listen 0.0.0.0:80;
    server_name kaktusa.ru www.kaktusa.ru;
    location ^~ /.well-known/acme-challenge/ { root /etc/nginx/acme-kaktusa; default_type "text/plain"; try_files $uri =404; }
    location /photos/ { alias /var/www/kaktusa/public/photos/; }
    location / { proxy_pass http://kaktusa_be; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
    listen 0.0.0.0:443 ssl;
    server_name kaktusa.ru www.kaktusa.ru;
    ssl_certificate /etc/nginx/certs/cert_kaktusa.crt;
    ssl_certificate_key /etc/nginx/certs/cert_kaktusa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =302 https://$host$request_uri;
    location ^~ /.well-known/acme-challenge/ { root /etc/nginx/acme-kaktusa; default_type "text/plain"; try_files $uri =404; }
    location /photos/ { alias /var/www/kaktusa/public/photos/; }
    location / {
        proxy_pass http://kaktusa_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kaktusa_conn_upgrade;
        proxy_read_timeout 300s;
    }
}
